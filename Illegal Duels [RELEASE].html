<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illegal Duels</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #070304;
      overflow: hidden;
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    }
    #title-screen {
      position: fixed;
      inset: 0;
      z-index: 2;
      background: #070304;
    }
    #title-screen[hidden] {
      display: none;
    }
    #back, #front {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #front {
      z-index: 2;
      pointer-events: none;
    }
    #desert {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #desert:active {
      cursor: grabbing;
    }
    #desert[hidden] {
      display: none;
    }
    #storm {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 30;
      pointer-events: none;
    }
    #storm[hidden] {
      display: none;
    }
    .hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 22px;
      margin: 0;
      text-align: center;
      color: #7a4632;
      font-size: 18px;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
      pointer-events: none;
      user-select: none;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    .hint.show {
      opacity: 1;
    }
    .hint[hidden] {
      display: none;
    }
    .menu {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 9vh;
      pointer-events: none;
    }
    .menu[hidden] {
      display: none;
    }
    .title {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2em;
      margin: 0;
      font-size: clamp(68px, 13vw, 150px);
      user-select: none;
    }
    .play {
      pointer-events: auto;
      cursor: pointer;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: clamp(28px, 4vw, 46px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f3e6d4;
      background: linear-gradient(180deg, #c14a42 0%, #8a2c28 48%, #3a1210 100%);
      border: 3px solid #1a0e0c;
      padding: 0.28em 3.2em 0.22em;
      text-shadow: 0 2px 0 rgba(28, 8, 6, 0.55);
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.45));
      transition: transform 0.16s ease, filter 0.16s ease, background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
      margin-top: 6vh;
      clip-path: polygon(
        0 0,
        78% 0,
        81% 9px,
        76% 15px,
        83% 13px,
        86% 24px,
        92% 18px,
        95% 30px,
        100% 36px,
        100% 100%,
        0 100%
      );
    }
    .play:hover {
      transform: scale(1.08);
      color: #fff1e6;
      background: linear-gradient(180deg, #d8665c 0%, #a43c36 48%, #4a1a16 100%);
      border-color: #2a1614;
      filter:
        drop-shadow(0 8px 12px rgba(0, 0, 0, 0.4))
        drop-shadow(0 0 16px rgba(210, 60, 40, 0.55));
    }
    .word {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.14em;
    }
    .letter {
      display: inline-block;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: 1em;
      line-height: 1;
      color: #fff6df;
      -webkit-text-stroke: 3px #2a0c04;
      paint-order: stroke fill;
      text-shadow:
        0 0 18px rgba(255, 120, 20, 0.85),
        0 7px 0 #4a1608,
        4px 12px 0 rgba(0, 0, 0, 0.45);
      transform: translate(var(--x), var(--y)) rotate(var(--r));
    }
    #picker,
    #weapons {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: safe center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
      pointer-events: none;
    }
    #picker[hidden],
    #weapons[hidden] {
      display: none;
    }
    .picker-panel {
      pointer-events: auto;
      width: min(760px, 100%);
      padding: 26px 28px 22px;
      text-align: center;
      color: #5c341c;
      background: rgba(255, 244, 224, 0.78);
      border: 4px solid #6b3a22;
      border-radius: 28px;
      box-shadow: 0 12px 28px rgba(90, 40, 10, 0.16);
    }
    .picker-panel h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin: 20px 0 22px;
    }
    .card {
      position: relative;
      width: 168px;
      padding: 14px 10px 12px;
      color: #5c341c;
      font: inherit;
      font-size: 22px;
      background: rgba(255, 250, 242, 0.92);
      border: 4px solid #e4d0b0;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(107, 58, 34, 0.12);
    }
    .card:hover {
      transform: translateY(-2px);
    }
    .card.selected {
      background: #fff3d4;
      border-color: #e07a2f;
      box-shadow: 0 6px 0 #e07a2f;
      transform: translateY(-4px);
    }
    .portrait {
      position: relative;
      display: block;
      width: 120px;
      height: 132px;
      margin: 0 auto 8px;
    }
    .hat-crown,
    .hat-brim,
    .face,
    .bandana {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .hat-crown {
      top: 4px;
      width: 58px;
      height: 36px;
      background: var(--hat);
      border: 3px solid rgba(60, 32, 16, 0.28);
      border-radius: 28px 28px 8px 8px;
      z-index: 1;
    }
    .hat-brim {
      top: 32px;
      width: 108px;
      height: 18px;
      background: var(--hat);
      border: 3px solid rgba(60, 32, 16, 0.28);
      border-radius: 50%;
      z-index: 3;
    }
    .face {
      top: 44px;
      width: 78px;
      height: 78px;
      background: #f6d0aa;
      border-radius: 50%;
      z-index: 2;
    }
    .face::before,
    .face::after {
      content: "";
      position: absolute;
      top: 32px;
      width: 8px;
      height: 8px;
      background: #2a1a12;
      border-radius: 50%;
    }
    .face::before { left: 20px; }
    .face::after { right: 20px; }
    .bandana {
      top: 102px;
      width: 70px;
      height: 24px;
      background: var(--bandana);
      z-index: 4;
      clip-path: polygon(0 0, 100% 0, 84% 100%, 50% 62%, 16% 100%);
    }
    .cowboy-name {
      display: block;
    }
    .continue {
      font: inherit;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: #fff8ee;
      background: #e07a2f;
      border: 3px solid #6b3a22;
      border-radius: 999px;
      padding: 0.35em 1.6em 0.3em;
      cursor: pointer;
      box-shadow: 0 4px 0 #6b3a22;
    }
    .continue:disabled {
      color: #8d735c;
      background: #eadcc8;
      border-color: #c9b49a;
      box-shadow: none;
      cursor: default;
    }
    .continue:not(:disabled):hover {
      background: #ef8b42;
    }
    .weapon-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 20px 0 22px;
    }
    .weapon-row .cards {
      margin: 0;
    }
    .cowboy-side {
      width: 168px;
      padding: 14px 10px 12px;
      color: #5c341c;
      font-size: 22px;
      background: rgba(255, 250, 242, 0.92);
      border: 4px solid #e4d0b0;
      border-radius: 22px;
      box-shadow: 0 4px 0 rgba(107, 58, 34, 0.12);
    }
    .weapon-icon,
    .held {
      position: relative;
      display: block;
      width: 120px;
      height: 132px;
      margin: 0 auto 8px;
    }
    .barrel,
    .cylinder,
    .grip,
    .loop,
    .tail {
      position: absolute;
      border: 3px solid rgba(60, 32, 16, 0.28);
    }
    .barrel {
      left: 16px;
      top: 54px;
      width: 86px;
      height: 16px;
      background: #9aa1a6;
      border-radius: 4px 10px 10px 4px;
    }
    .cylinder {
      left: 30px;
      top: 46px;
      width: 30px;
      height: 32px;
      background: #d5d8db;
      border-radius: 7px;
    }
    .grip {
      left: 24px;
      top: 68px;
      width: 18px;
      height: 40px;
      background: #6b3e26;
      border-radius: 4px 4px 10px 10px;
      transform: rotate(24deg);
    }
    .loop {
      left: 18px;
      top: 24px;
      width: 78px;
      height: 78px;
      border-width: 8px;
      border-color: #e4c15a;
      border-radius: 50%;
      background: transparent;
    }
    .tail {
      left: 78px;
      top: 92px;
      width: 26px;
      height: 8px;
      background: #e4c15a;
      border-radius: 6px;
      transform: rotate(28deg);
    }
    .weapon-icon.revolver .loop,
    .weapon-icon.revolver .tail,
    .weapon-icon.lasso .barrel,
    .weapon-icon.lasso .cylinder,
    .weapon-icon.lasso .grip {
      display: none;
    }
    .held {
      position: absolute;
      right: -8px;
      bottom: -2px;
      width: 62px;
      height: 44px;
      margin: 0;
      z-index: 5;
    }
    .held:not(.revolver):not(.lasso) {
      display: none;
    }
    .held .barrel {
      left: 8px;
      top: 18px;
      width: 52px;
      height: 10px;
    }
    .held .cylinder {
      left: 16px;
      top: 12px;
      width: 18px;
      height: 20px;
    }
    .held .grip {
      left: 12px;
      top: 26px;
      width: 12px;
      height: 24px;
    }
    .held .loop {
      left: 6px;
      top: 0;
      width: 36px;
      height: 36px;
      border-width: 5px;
    }
    .held .tail {
      left: 34px;
      top: 28px;
      width: 14px;
      height: 5px;
    }
    .held.revolver .loop,
    .held.revolver .tail,
    .held.lasso .barrel,
    .held.lasso .cylinder,
    .held.lasso .grip {
      display: none;
    }
  </style>
</head>
<body>
  <div id="title-screen">
  <canvas id="back"></canvas>
  <div class="menu">
    <h1 class="title" aria-label="Illegal Duels">
      <span class="word">
        <span class="letter" style="--x:0;--y:-0.04em;--r:-3deg">I</span>
        <span class="letter" style="--x:0;--y:0.05em;--r:4deg">l</span>
        <span class="letter" style="--x:0;--y:-0.02em;--r:-2deg">l</span>
        <span class="letter" style="--x:0;--y:0.04em;--r:3deg">e</span>
        <span class="letter" style="--x:0;--y:-0.05em;--r:-4deg">g</span>
        <span class="letter" style="--x:0;--y:0.03em;--r:2deg">a</span>
        <span class="letter" style="--x:0;--y:-0.03em;--r:3deg">l</span>
      </span>
      <span class="word">
        <span class="letter" style="--x:0;--y:0.04em;--r:-3deg">D</span>
        <span class="letter" style="--x:0;--y:-0.05em;--r:4deg">u</span>
        <span class="letter" style="--x:0;--y:0.02em;--r:-2deg">e</span>
        <span class="letter" style="--x:0;--y:-0.04em;--r:3deg">l</span>
        <span class="letter" style="--x:0;--y:0.05em;--r:-3deg">s</span>
      </span>
    </h1>
    <button class="play" type="button">Play</button>
  </div>
  <canvas id="front"></canvas>
  </div>
  <canvas id="storm" hidden></canvas>
  <p class="hint" hidden>Drag to look in any direction</p>
  <div id="picker" hidden>
    <div class="picker-panel">
      <h2>Pick your cowboy</h2>
      <div class="cards">
        <button class="card" type="button" data-cowboy="Dusty" aria-pressed="false" style="--hat:#6b3e26;--bandana:#e23d3d">
          <span class="portrait" aria-hidden="true">
            <span class="hat-crown"></span>
            <span class="hat-brim"></span>
            <span class="face"></span>
            <span class="bandana"></span>
          </span>
          <span class="cowboy-name">Dusty</span>
        </button>
        <button class="card" type="button" data-cowboy="Biscuit" aria-pressed="false" style="--hat:#e4c15a;--bandana:#3a78d0">
          <span class="portrait" aria-hidden="true">
            <span class="hat-crown"></span>
            <span class="hat-brim"></span>
            <span class="face"></span>
            <span class="bandana"></span>
          </span>
          <span class="cowboy-name">Biscuit</span>
        </button>
        <button class="card" type="button" data-cowboy="Poppy" aria-pressed="false" style="--hat:#f7f4ee;--bandana:#f48cb8">
          <span class="portrait" aria-hidden="true">
            <span class="hat-crown"></span>
            <span class="hat-brim"></span>
            <span class="face"></span>
            <span class="bandana"></span>
          </span>
          <span class="cowboy-name">Poppy</span>
        </button>
      </div>
      <button class="continue" type="button" disabled>Continue</button>
    </div>
  </div>
  <div id="weapons" hidden>
    <div class="picker-panel">
      <h2>Pick your weapon</h2>
      <div class="weapon-row">
        <div class="cowboy-side" id="weapon-cowboy">
          <span class="portrait" aria-hidden="true">
            <span class="hat-crown"></span>
            <span class="hat-brim"></span>
            <span class="face"></span>
            <span class="bandana"></span>
            <span class="held">
              <span class="barrel"></span>
              <span class="cylinder"></span>
              <span class="grip"></span>
              <span class="loop"></span>
              <span class="tail"></span>
            </span>
          </span>
          <span class="cowboy-name" id="weapon-cowboy-name"></span>
        </div>
        <div class="cards">
          <button class="card" type="button" data-weapon="Revolver" aria-pressed="false">
            <span class="weapon-icon revolver" aria-hidden="true">
              <span class="barrel"></span>
              <span class="cylinder"></span>
              <span class="grip"></span>
            </span>
            <span class="cowboy-name">Revolver</span>
          </button>
          <button class="card" type="button" data-weapon="Lasso" aria-pressed="false">
            <span class="weapon-icon lasso" aria-hidden="true">
              <span class="loop"></span>
              <span class="tail"></span>
            </span>
            <span class="cowboy-name">Lasso</span>
          </button>
        </div>
      </div>
      <button class="continue" type="button" disabled>Confirm</button>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";

    const ARENA_RADIUS = 8;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.id = "desert";
    renderer.domElement.hidden = true;
    document.body.prepend(renderer.domElement);

    const titleScreen = document.getElementById("title-screen");
    const hint = document.querySelector(".hint");
    const picker = document.getElementById("picker");
    const continueButton = picker.querySelector(".continue");
    const cards = [...picker.querySelectorAll(".card")];
    const weapons = document.getElementById("weapons");
    const confirmButton = weapons.querySelector(".continue");
    const weaponCards = [...weapons.querySelectorAll(".card")];
    const weaponCowboy = document.getElementById("weapon-cowboy");
    const weaponCowboyName = document.getElementById("weapon-cowboy-name");
    const held = weapons.querySelector(".held");
    const storm = document.getElementById("storm");
    const stormCtx = storm.getContext("2d");
    let mode = "title";
    let pendingCowboy = null;
    let chosenCowboy = null;
    let pendingWeapon = null;
    let chosenWeapon = null;
    let stormTime = 0;
    let stormLast = 0;
    let stormRevealed = false;
    const STORM_DURATION = 2.2;
    const grains = [];

    document.querySelector(".play").addEventListener("click", () => {
      if (mode !== "title") return;
      mode = "enter";
      stormTime = 0;
      stormLast = performance.now();
      stormRevealed = false;
      storm.hidden = false;
      fillGrains();
      playWind();
    });

    function revealDesert() {
      titleScreen.hidden = true;
      renderer.domElement.hidden = false;
      document.body.style.background = "#f6b183";
    }

    function finishStorm() {
      mode = "desert";
      storm.hidden = true;
      hint.hidden = true;
      picker.hidden = false;
    }

    function selectCowboy(card) {
      pendingCowboy = card.dataset.cowboy;
      for (const other of cards) {
        const on = other === card;
        other.classList.toggle("selected", on);
        other.setAttribute("aria-pressed", on ? "true" : "false");
      }
      continueButton.disabled = false;
    }

    for (const card of cards) {
      card.addEventListener("click", () => selectCowboy(card));
    }

    function resetWeapons() {
      pendingWeapon = null;
      chosenWeapon = null;
      delete weapons.dataset.chosen;
      confirmButton.disabled = true;
      held.classList.remove("revolver", "lasso");
      for (const card of weaponCards) {
        card.classList.remove("selected");
        card.setAttribute("aria-pressed", "false");
      }
    }

    function selectWeapon(card) {
      pendingWeapon = card.dataset.weapon;
      for (const other of weaponCards) {
        const on = other === card;
        other.classList.toggle("selected", on);
        other.setAttribute("aria-pressed", on ? "true" : "false");
      }
      held.classList.remove("revolver", "lasso");
      held.classList.add(pendingWeapon === "Revolver" ? "revolver" : "lasso");
      confirmButton.disabled = false;
    }

    continueButton.addEventListener("click", () => {
      if (!pendingCowboy) return;
      chosenCowboy = pendingCowboy;
      picker.dataset.chosen = chosenCowboy;
      const card = cards.find((item) => item.dataset.cowboy === chosenCowboy);
      weaponCowboy.style.setProperty("--hat", card.style.getPropertyValue("--hat"));
      weaponCowboy.style.setProperty("--bandana", card.style.getPropertyValue("--bandana"));
      weaponCowboyName.textContent = chosenCowboy;
      resetWeapons();
      picker.hidden = true;
      weapons.hidden = false;
    });

    for (const card of weaponCards) {
      card.addEventListener("click", () => selectWeapon(card));
    }

    confirmButton.addEventListener("click", () => {
      if (!pendingWeapon) return;
      chosenWeapon = pendingWeapon;
      weapons.dataset.chosen = chosenWeapon;
    });

    const toonGradient = makeToonGradient();

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 500);
    const look = attachLook(camera, renderer.domElement);

    scene.add(makeSky());
    scene.add(makeSun());
    addLights(scene);
    scene.add(makeSand());
    scene.add(makeCorral(ARENA_RADIUS));
    placeCacti(scene);

    const back = document.getElementById("back");
    const front = document.getElementById("front");
    const backCtx = back.getContext("2d");
    const frontCtx = front.getContext("2d");
    const title = document.querySelector(".title");
    let titleWidth = 0;
    let titleHeight = 0;
    let shake = 0;
    const bursts = [];
    const embers = [];

    function resizeTitle() {
      titleWidth = window.innerWidth;
      titleHeight = window.innerHeight;
      const ratio = window.devicePixelRatio || 1;
      for (const canvas of [back, front, storm]) {
        canvas.width = Math.floor(titleWidth * ratio);
        canvas.height = Math.floor(titleHeight * ratio);
        canvas.getContext("2d").setTransform(ratio, 0, 0, ratio, 0, 0);
      }
    }

    function resizeDesert() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", () => {
      resizeTitle();
      resizeDesert();
    });

    let last = performance.now();
    let spawnIn = 0.15;

    function frame(now) {
      if (mode !== "desert") drawTitle(now);
      if (mode === "enter") drawStorm(now);
      if (mode === "desert" || mode === "enter") {
        look.update();
        renderer.render(scene, camera);
      }
      requestAnimationFrame(frame);
    }

    resizeTitle();
    resizeDesert();
    seedTitle();
    requestAnimationFrame(frame);

    function drawTitle(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      spawnIn -= dt;
      if (spawnIn <= 0) {
        const big = Math.random() < 0.28;
        explode(
          titleWidth * (0.08 + Math.random() * 0.84),
          titleHeight * (0.12 + Math.random() * 0.76),
          big ? 0.85 + Math.random() * 0.45 : 0.35 + Math.random() * 0.4
        );
        spawnIn = 0.05 + Math.random() * 0.14;
      }
      if (Math.random() < 0.6) spawnEmber();

      backCtx.globalCompositeOperation = "source-over";
      const sky = backCtx.createLinearGradient(0, 0, 0, titleHeight);
      sky.addColorStop(0, "#14060a");
      sky.addColorStop(0.55, "#2a0c08");
      sky.addColorStop(1, "#4a1608");
      backCtx.fillStyle = sky;
      backCtx.fillRect(0, 0, titleWidth, titleHeight);

      for (const burst of bursts) {
        for (const puff of burst.smoke) {
          const t = puff.age / puff.life;
          backCtx.beginPath();
          backCtx.fillStyle = "rgba(40, 22, 18, " + (0.28 * (1 - t)) + ")";
          backCtx.arc(puff.x, puff.y, puff.size * (1 + t * 2.2), 0, Math.PI * 2);
          backCtx.fill();
        }
      }

      backCtx.globalCompositeOperation = "lighter";
      for (const burst of bursts) {
        const t = burst.age / burst.life;
        const flash = backCtx.createRadialGradient(burst.x, burst.y, 0, burst.x, burst.y, 30 + burst.power * 90);
        flash.addColorStop(0, "rgba(255,255,240," + (0.9 * (1 - t)) + ")");
        flash.addColorStop(0.35, "rgba(255,150,30," + (0.55 * (1 - t)) + ")");
        flash.addColorStop(1, "rgba(255,40,0,0)");
        backCtx.fillStyle = flash;
        backCtx.beginPath();
        backCtx.arc(burst.x, burst.y, 30 + burst.power * 90, 0, Math.PI * 2);
        backCtx.fill();

        backCtx.strokeStyle = "rgba(255, 210, 140, " + (0.7 * (1 - t)) + ")";
        backCtx.lineWidth = 3 * (1 - t) + 1;
        backCtx.beginPath();
        backCtx.arc(burst.x, burst.y, burst.ring, 0, Math.PI * 2);
        backCtx.stroke();

        for (const spark of burst.sparks) {
          const st = spark.age / spark.life;
          const hot = spark.hot > 0.55;
          const color = hot
            ? "rgba(255, 244, 210, " + (1 - st) + ")"
            : "rgba(255, " + Math.floor(80 + spark.hot * 130) + ", 16, " + (1 - st) + ")";
          backCtx.strokeStyle = color;
          backCtx.lineWidth = spark.size * 0.7;
          backCtx.lineCap = "round";
          backCtx.beginPath();
          backCtx.moveTo(spark.x, spark.y);
          backCtx.lineTo(spark.x - spark.vx * spark.streak, spark.y - spark.vy * spark.streak);
          backCtx.stroke();
          backCtx.fillStyle = color;
          backCtx.fillRect(spark.x, spark.y, spark.size, spark.size);
        }
      }

      frontCtx.clearRect(0, 0, titleWidth, titleHeight);
      frontCtx.globalCompositeOperation = "lighter";
      for (const ember of embers) {
        const t = ember.age / ember.life;
        frontCtx.fillStyle = "rgba(255, " + Math.floor(140 + (1 - t) * 80) + ", 40, " + (1 - t) + ")";
        frontCtx.beginPath();
        frontCtx.arc(ember.x, ember.y, ember.size, 0, Math.PI * 2);
        frontCtx.fill();
      }

      for (let i = bursts.length - 1; i >= 0; i--) {
        const burst = bursts[i];
        burst.age += dt;
        burst.ring += (220 + burst.power * 260) * dt;
        for (const spark of burst.sparks) {
          spark.age += dt;
          spark.x += spark.vx * dt;
          spark.y += spark.vy * dt;
          spark.vy += 140 * dt;
          spark.vx *= 0.985;
        }
        for (const puff of burst.smoke) {
          puff.age += dt;
          puff.x += puff.vx * dt;
          puff.y += puff.vy * dt;
        }
        burst.sparks = burst.sparks.filter((spark) => spark.age < spark.life);
        burst.smoke = burst.smoke.filter((puff) => puff.age < puff.life);
        if (burst.age >= burst.life && burst.sparks.length === 0) bursts.splice(i, 1);
      }

      for (let i = embers.length - 1; i >= 0; i--) {
        const ember = embers[i];
        ember.age += dt;
        ember.x += ember.vx * dt;
        ember.y += ember.vy * dt;
        if (ember.age >= ember.life || ember.y < -10) embers.splice(i, 1);
      }

      shake *= Math.pow(0.04, dt);
      if (shake < 0.2) shake = 0;
      const jx = (Math.random() - 0.5) * shake;
      const jy = (Math.random() - 0.5) * shake;
      title.style.transform = "translate(" + jx.toFixed(2) + "px," + jy.toFixed(2) + "px)";
    }

    function spawnEmber() {
      embers.push({
        x: Math.random() * titleWidth,
        y: titleHeight * (0.35 + Math.random() * 0.7),
        vy: -20 - Math.random() * 50,
        vx: -12 + Math.random() * 24,
        life: 1.4 + Math.random() * 2.2,
        age: 0,
        size: 1 + Math.random() * 2.4
      });
    }

    function explode(x, y, power) {
      const sparks = [];
      const smoke = [];
      const sparkCount = 28 + Math.floor(power * 46);
      for (let i = 0; i < sparkCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (50 + Math.random() * 280) * (0.45 + power);
        sparks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 30 * power,
          life: 0.4 + Math.random() * 0.75,
          age: 0,
          size: 1.6 + Math.random() * 3.2 * power,
          hot: Math.random(),
          streak: 0.02 + Math.random() * 0.045
        });
      }
      const smokeCount = 8 + Math.floor(power * 10);
      for (let i = 0; i < smokeCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        smoke.push({
          x: x + Math.cos(angle) * 8,
          y: y + Math.sin(angle) * 8,
          vx: Math.cos(angle) * (12 + Math.random() * 30),
          vy: -10 - Math.random() * 40,
          life: 0.9 + Math.random() * 1.1,
          age: 0,
          size: 6 + Math.random() * 8 * power
        });
      }
      bursts.push({ x, y, power, age: 0, life: 0.55 + power * 0.25, ring: 6, sparks, smoke });
      if (power > 0.72) shake = Math.max(shake, 7 + power * 8);
    }

    function seedTitle() {
      for (let i = 0; i < 12; i++) {
        explode(Math.random() * titleWidth, Math.random() * titleHeight * 0.92, 0.5 + Math.random() * 0.8);
      }
      for (let i = 0; i < 40; i++) spawnEmber();
    }

    function fillGrains() {
      grains.length = 0;
      for (let i = 0; i < 240; i++) {
        grains.push({
          x: Math.random(),
          y: Math.random(),
          speed: 0.55 + Math.random() * 1.15,
          size: 1.2 + Math.random() * 2.6,
          shade: Math.random()
        });
      }
    }

    function drawStorm(now) {
      const dt = Math.min(0.033, (now - stormLast) / 1000);
      stormLast = now;
      stormTime += dt;
      const progress = Math.min(1, stormTime / STORM_DURATION);
      const w = titleWidth;
      const h = titleHeight;
      const band = w * 1.15;
      const front = -0.25 * w + progress * w * 2.55;
      const back = front - band;

      stormCtx.clearRect(0, 0, w, h);
      const dust = stormCtx.createLinearGradient(back, 0, front, 0);
      dust.addColorStop(0, "rgba(232, 190, 110, 0)");
      dust.addColorStop(0.2, "rgba(214, 164, 78, 0.8)");
      dust.addColorStop(0.42, "rgba(176, 118, 52, 0.98)");
      dust.addColorStop(0.72, "rgba(228, 190, 112, 0.98)");
      dust.addColorStop(1, "rgba(244, 224, 168, 0)");
      stormCtx.fillStyle = dust;
      stormCtx.fillRect(0, 0, w, h);

      stormCtx.lineCap = "round";
      for (const grain of grains) {
        const along = (grain.x + progress * grain.speed) % 1;
        const x = back + along * band;
        const y = grain.y * h + Math.sin(progress * 16 + grain.y * 14) * 10;
        const tone = grain.shade > 0.55 ? "244, 224, 168" : "150, 96, 42";
        stormCtx.strokeStyle = "rgba(" + tone + "," + (0.4 + grain.shade * 0.5) + ")";
        stormCtx.lineWidth = grain.size;
        stormCtx.beginPath();
        stormCtx.moveTo(x, y);
        stormCtx.lineTo(x - 12 - grain.speed * 16, y + 1.5);
        stormCtx.stroke();
      }

      if (!stormRevealed && front >= w && back <= 0) {
        stormRevealed = true;
        revealDesert();
      }
      if (progress >= 1) finishStorm();
    }

    function playWind() {
      let audio;
      try {
        audio = new AudioContext();
      } catch (error) {
        return;
      }
      const rate = audio.sampleRate;
      const length = Math.floor(rate * 2);
      const buffer = audio.createBuffer(1, length, rate);
      const data = buffer.getChannelData(0);
      let brown = 0;
      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        brown = brown * 0.985 + white * 0.015;
        data[i] = brown * 4;
      }
      const source = audio.createBufferSource();
      source.buffer = buffer;
      source.loop = true;
      const filter = audio.createBiquadFilter();
      filter.type = "bandpass";
      filter.Q.value = 0.55;
      const gain = audio.createGain();
      const now = audio.currentTime;
      filter.frequency.setValueAtTime(220, now);
      filter.frequency.linearRampToValueAtTime(820, now + 0.45);
      filter.frequency.linearRampToValueAtTime(160, now + 2);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.3, now + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.14, now + 1.2);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.05);
      source.connect(filter);
      filter.connect(gain);
      gain.connect(audio.destination);
      audio.resume();
      source.start();
      source.stop(now + 2.15);
    }

    function makeToonGradient() {
      const canvas = document.createElement("canvas");
      canvas.width = 4;
      canvas.height = 1;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#9a9a9a";
      ctx.fillRect(0, 0, 1, 1);
      ctx.fillStyle = "#c4c4c4";
      ctx.fillRect(1, 0, 1, 1);
      ctx.fillStyle = "#e4e4e4";
      ctx.fillRect(2, 0, 1, 1);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(3, 0, 1, 1);
      const texture = new THREE.CanvasTexture(canvas);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      return texture;
    }

    function toon(color) {
      return new THREE.MeshToonMaterial({ color, gradientMap: toonGradient });
    }

    function makeSky() {
      const canvas = document.createElement("canvas");
      canvas.width = 8;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, "#e98b78");
      gradient.addColorStop(0.38, "#f6b183");
      gradient.addColorStop(0.68, "#ffd0a4");
      gradient.addColorStop(1, "#ffe6b8");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 8, 512);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sky = new THREE.Mesh(
        new THREE.SphereGeometry(220, 32, 24),
        new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide, depthWrite: false })
      );
      sky.renderOrder = -1;
      return sky;
    }

    function makeSunTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");
      const glow = ctx.createRadialGradient(64, 64, 8, 64, 64, 64);
      glow.addColorStop(0, "rgba(255, 248, 220, 1)");
      glow.addColorStop(0.35, "rgba(255, 214, 140, 0.95)");
      glow.addColorStop(1, "rgba(255, 176, 110, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function makeSun() {
      const sun = new THREE.Sprite(new THREE.SpriteMaterial({
        map: makeSunTexture(),
        transparent: true,
        depthWrite: false
      }));
      sun.position.set(-34, 16, -40);
      sun.scale.set(22, 22, 1);
      return sun;
    }

    function addLights(scene) {
      scene.add(new THREE.HemisphereLight(0xffd2b4, 0xe8c56e, 0.72));
      const sun = new THREE.DirectionalLight(0xfff1d2, 1.35);
      sun.position.set(-18, 14, -16);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -22;
      sun.shadow.camera.right = 22;
      sun.shadow.camera.top = 22;
      sun.shadow.camera.bottom = -22;
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 70;
      sun.shadow.bias = -0.0008;
      scene.add(sun);
    }

    function makeSand() {
      const sand = new THREE.Mesh(
        new THREE.CircleGeometry(80, 64),
        toon(0xf0d78c)
      );
      sand.rotation.x = -Math.PI / 2;
      sand.receiveShadow = true;
      return sand;
    }

    function makeCorral(radius) {
      const corral = new THREE.Group();
      const postMaterial = toon(0xc68642);
      const railMaterial = toon(0xe0a15a);
      const postCount = 18;
      for (let i = 0; i < postCount; i++) {
        const angle = (i / postCount) * Math.PI * 2;
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 1.8, 10), postMaterial);
        post.position.set(Math.cos(angle) * radius, 0.9, Math.sin(angle) * radius);
        post.castShadow = true;
        post.receiveShadow = true;
        corral.add(post);
      }
      for (const height of [0.72, 1.28]) {
        const rail = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.07, 8, 64), railMaterial);
        rail.rotation.x = Math.PI / 2;
        rail.position.y = height;
        rail.castShadow = true;
        rail.receiveShadow = true;
        corral.add(rail);
      }
      return corral;
    }

    function makeCactus(scale, tint) {
      const cactus = new THREE.Group();
      const material = toon(tint);
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.32 * scale, 1.15 * scale, 4, 8), material);
      body.position.y = 0.95 * scale;
      body.castShadow = true;
      cactus.add(body);
      const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.16 * scale, 0.42 * scale, 4, 8), material);
      arm.position.set(-0.42 * scale, 1.05 * scale, 0);
      arm.rotation.z = Math.PI / 2.5;
      arm.castShadow = true;
      cactus.add(arm);
      const tip = new THREE.Mesh(new THREE.CapsuleGeometry(0.15 * scale, 0.28 * scale, 4, 8), material);
      tip.position.set(-0.62 * scale, 1.32 * scale, 0);
      tip.castShadow = true;
      cactus.add(tip);
      return cactus;
    }

    function placeCacti(scene) {
      const spots = [
        { angle: -2.4, distance: 10.2, scale: 1, tint: 0x73c46a, turn: 0.8 },
        { angle: -1.55, distance: 10.6, scale: 1.15, tint: 0x5eae58, turn: 0.2 },
        { angle: -0.7, distance: 10.2, scale: 0.9, tint: 0x8ed17a, turn: -0.6 }
      ];
      for (const spot of spots) {
        const cactus = makeCactus(spot.scale, spot.tint);
        cactus.position.set(Math.cos(spot.angle) * spot.distance, 0, Math.sin(spot.angle) * spot.distance);
        cactus.rotation.y = spot.turn;
        scene.add(cactus);
      }
    }

    function attachLook(camera, element) {
      const eye = new THREE.Vector3(0, 8, 30);
      const toward = new THREE.Vector3(0, 2.2, 0).sub(eye);
      let yaw = Math.atan2(toward.x, toward.z);
      let pitch = Math.atan2(toward.y, Math.hypot(toward.x, toward.z));
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      element.addEventListener("pointerdown", (event) => {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        element.setPointerCapture(event.pointerId);
      });
      element.addEventListener("pointerup", () => {
        dragging = false;
      });
      element.addEventListener("pointercancel", () => {
        dragging = false;
      });
      element.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        yaw -= (event.clientX - lastX) * 0.005;
        pitch -= (event.clientY - lastY) * 0.005;
        pitch = Math.max(-1.2, Math.min(1.2, pitch));
        lastX = event.clientX;
        lastY = event.clientY;
      });
      element.addEventListener("wheel", (event) => {
        event.preventDefault();
        const forward = lookDirection(yaw, pitch);
        eye.addScaledVector(forward, -event.deltaY * 0.012);
        eye.y = Math.max(1.2, Math.min(28, eye.y));
        const flat = Math.hypot(eye.x, eye.z);
        if (flat < 5) {
          eye.x *= 5 / flat;
          eye.z *= 5 / flat;
        }
        if (flat > 40) {
          eye.x *= 40 / flat;
          eye.z *= 40 / flat;
        }
      }, { passive: false });

      return {
        update() {
          camera.position.copy(eye);
          camera.lookAt(eye.clone().add(lookDirection(yaw, pitch)));
        }
      };
    }

    function lookDirection(yaw, pitch) {
      const cosPitch = Math.cos(pitch);
      return new THREE.Vector3(Math.sin(yaw) * cosPitch, Math.sin(pitch), Math.cos(yaw) * cosPitch);
    }
  </script>
